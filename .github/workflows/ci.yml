# Continuous integration for the Sisu repository.
# Runs on every push and pull request only; no scheduled runs are configured
# (owner's decision, October 2026).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: documentation links and IDs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links and Q/D references
        run: python3 tools/check_docs.py

  harness:
    name: taskbench build, tests and smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: taskbench
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          go version || true
          java -version 2>&1 || true
          ulimit -a
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Build (release)
        run: cargo build --release
      - name: Tests
        run: cargo test
      - name: Smoke run (harness and controls)
        run: |
          ./run_all.sh --scale smoke --machine-id github-runner \
            --out "results/github-runner/${GITHUB_SHA::12}"
      - name: Summarise
        run: python3 summarize.py "results/github-runner/${GITHUB_SHA::12}" || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskbench-smoke-${{ github.sha }}
          path: taskbench/results/github-runner/
          if-no-files-found: warn

  compiler:
    name: stage-0 compiler format, lints, build, tests and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.0
          rustc --version
          cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Build
        run: cargo build
      - name: sisu fmt --check (std and the canonical conformance cases)
        run: |
          ./target/debug/sisu fmt --check std
          # Every case file that parses, unless NAME.unformatted says why
          # the case is not in canonical form (conformance/README.md).
          status=0
          while read -r f; do
            base="${f%%.pkg/*}"
            [ "$base" = "$f" ] && base="${f%.sisu}"
            [ -e "$base.unformatted" ] && continue
            ./target/debug/sisu parse --shape "$f" > /dev/null 2>&1 || continue
            ./target/debug/sisu fmt --check "$f" || status=1
          done < <(find conformance/cases -name '*.sisu' -not -path '*.files/*' | sort)
          exit $status
      - name: Tests (unit tests and the conformance suite)
        run: cargo test
      - name: Speed (informational, never fails)
        # Front-end milliseconds per kLOC and interpreter nanoseconds per
        # step for std and the conformance corpus (docs/port-debt.md, Phase 0).
        continue-on-error: true
        run: cargo run --release -p sisu-driver --example speed || true

  native:
    # Stage 2's native backend (compiler/docs/architecture.md, "Stage 2"):
    # every case of compiler/conformance/native.list built with `sisu build
    # --native`, run, and compared with the interpreter's expectations.
    # On pushes only, like the rest of CI, never on a schedule.
    name: stage-2 native backend conformance
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup override set 1.97.0
          rustc --version
          cc --version
      - name: Cache the cargo registry and the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler/target
          key: native-${{ runner.os }}-rust-1.97.0-${{ hashFiles('compiler/Cargo.lock') }}
          restore-keys: |
            native-${{ runner.os }}-rust-1.97.0-
      - name: Build the compiler, the runtime and the runner
        run: cargo build
      - name: Native conformance (conformance/native.list)
        run: ./target/debug/sisu-conformance --sisu target/debug/sisu --native conformance/native.list
      - name: Native conformance from serialised SIR (`--from-sir`)
        # The path a self-hosted front end takes (decision 212): each case
        # built from its own `.sir`, else from what `sisu sir` prints.
        run: ./target/debug/sisu-conformance --sisu target/debug/sisu --native-from-sir conformance/native.list
      - name: Native conformance, release profile (`--release`)
        # Cranelift's optimisations, every contract checked (decision 232).
        run: ./target/debug/sisu-conformance --sisu target/debug/sisu --native-release conformance/native.list
      - name: Stage 1 compiled natively (informational, never fails)
        # The bootstrap path: stage 1 built by the backend, its token
        # stream and tree of the prelude against stage 0's.
        continue-on-error: true
        working-directory: compiler/stage1
        run: |
          ../target/debug/sisu build --native --output "$RUNNER_TEMP/stage1"
          "$RUNNER_TEMP/stage1" tokens --trivia ../std/prelude.sisu > "$RUNNER_TEMP/tokens.native"
          ../target/debug/sisu tokens --trivia ../std/prelude.sisu > "$RUNNER_TEMP/tokens.stage0"
          cmp "$RUNNER_TEMP/tokens.native" "$RUNNER_TEMP/tokens.stage0"
          "$RUNNER_TEMP/stage1" parse --tree ../std/prelude.sisu > "$RUNNER_TEMP/tree.native"
          ../target/debug/sisu parse --tree ../std/prelude.sisu > "$RUNNER_TEMP/tree.stage0"
          cmp "$RUNNER_TEMP/tree.native" "$RUNNER_TEMP/tree.stage0"
