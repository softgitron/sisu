# Continuous integration for the Sisu repository.
# Runs on every push and pull request only; no scheduled runs are configured
# (owner's decision, October 2026).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: documentation links and IDs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links and Q/D references
        run: python3 tools/check_docs.py

  harness:
    name: taskbench build, tests and smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: taskbench
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          go version || true
          java -version 2>&1 || true
          ulimit -a
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Build (release)
        run: cargo build --release
      - name: Tests
        run: cargo test
      - name: Smoke run (harness and controls)
        run: |
          ./run_all.sh --scale smoke --machine-id github-runner \
            --out "results/github-runner/${GITHUB_SHA::12}"
      - name: Summarise
        run: python3 summarize.py "results/github-runner/${GITHUB_SHA::12}" || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskbench-smoke-${{ github.sha }}
          path: taskbench/results/github-runner/
          if-no-files-found: warn

  compiler:
    name: compiler format, lints, build, tests and conformance through stage 1
    runs-on: ubuntu-latest
    # The suite through stage 1 takes about three times as long as through
    # the Rust front end (decision 268).
    timeout-minutes: 60
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.0
          rustc --version
          cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Build
        run: cargo build
      - name: Stage 1, the front end of `sisu` (built natively on first use)
        # `sisu` runs stage 1, the front end written in Sisu, for `check`,
        # `sir`, `build`, `run`, `fmt`, `doc`, `tokens` and `parse`
        # (decision 268); the first command builds it from compiler/stage1
        # with the Rust front end into target/stage1/sisu1.
        run: ./target/debug/sisu tokens std/prelude.sisu > /dev/null
      - name: sisu fmt --check (std and the canonical conformance cases)
        # Stage 1's formatter, over every case file that parses, unless
        # NAME.unformatted says why the case is not in canonical form
        # (conformance/README.md), in one run.
        run: |
          files=()
          while read -r f; do
            base="${f%%.pkg/*}"
            [ "$base" = "$f" ] && base="${f%.sisu}"
            [ -e "$base.unformatted" ] && continue
            ./target/debug/sisu parse --shape "$f" > /dev/null 2>&1 || continue
            files+=("$f")
          done < <(find conformance/cases -name '*.sisu' -not -path '*.files/*' | sort)
          ./target/debug/sisu fmt --check std "${files[@]}"
      - name: Tests (unit tests and the conformance suite, through stage 1)
        # The suite's expectations (`.diag`, `.sir`, `.doc`, `.out`, `.err`,
        # `.status`, ...) against what `sisu` prints with stage 1 as its
        # front end; the commands stage 1 does not serve yet (`test`,
        # `bench`, `repl`, `ws`, `run --watch`, `replay`, ...) run on the
        # Rust front end (docs/port-debt.md).
        run: cargo test
      - name: What the failed native tests left (their scratch directories)
        # A test of crates/sisu-driver/tests/native.rs removes its scratch
        # directory, /tmp/sisu-native-NAME-PID, only when it passes: what a
        # failed one built is uploaded for inspection.
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/native-scratch"
          cp -r /tmp/sisu-native-* "$RUNNER_TEMP/native-scratch/" 2>/dev/null || true
          du -sh "$RUNNER_TEMP/native-scratch" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-scratch-${{ github.sha }}
          path: ${{ runner.temp }}/native-scratch/
          if-no-files-found: ignore
      - name: Speed (informational, never fails)
        # Front-end milliseconds per kLOC and interpreter nanoseconds per
        # step for std and the conformance corpus (docs/port-debt.md, Phase 0).
        continue-on-error: true
        run: cargo run --release -p sisu-driver --example speed || true

  native:
    # Stage 2's native backend (compiler/docs/architecture.md, "Stage 2"):
    # every case of compiler/conformance/native.list built with `sisu build
    # --native`, run, and compared with the interpreter's expectations.
    # On pushes only, like the rest of CI, never on a schedule.
    name: stage-2 native backend conformance
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup override set 1.97.0
          rustc --version
          cc --version
      - name: Cache the cargo registry and the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler/target
          key: native-${{ runner.os }}-rust-1.97.0-${{ hashFiles('compiler/Cargo.lock') }}
          restore-keys: |
            native-${{ runner.os }}-rust-1.97.0-
      - name: Build the compiler, the runtime and the runner
        run: cargo build
      - name: Stage 1, the front end of `sisu` (built natively on first use)
        # Built once here, before the cases' parallel builds: a case's build
        # that waits for stage 1's own would otherwise hit the runner's
        # 60-second limit when the cache holds a stage 1 older than its
        # sources.
        run: ./target/debug/sisu tokens std/prelude.sisu > /dev/null
      - name: Native conformance (conformance/native.list)
        # Each case built by `sisu build --native`, its front end stage 1's
        # (decision 268), its LIR compiled by the x86-64 backend written in
        # Sisu, the debug profile's (decision 331), and run.
        run: ./target/debug/sisu-conformance --sisu target/debug/sisu --native conformance/native.list
      - name: Native conformance from serialised SIR (`--from-sir`)
        # The path a self-hosted front end takes (decision 212): each case
        # built from its own `.sir`, else from what `sisu sir` prints,
        # which is stage 1's SIR.
        run: ./target/debug/sisu-conformance --sisu target/debug/sisu --native-from-sir conformance/native.list
      - name: Native conformance, release profile (`--release`)
        # Cranelift's optimisations, every contract checked (decision 232).
        run: ./target/debug/sisu-conformance --sisu target/debug/sisu --native-release conformance/native.list
      - name: The same SIR in the interpreter (`sisu run --from-sir`)
        # What a front end serialised, run rather than compiled (decision 254).
        run: ./target/debug/sisu-conformance --sisu target/debug/sisu --interpreted-from-sir conformance/native.list
      - name: Native conformance from LIR (stage 2's lowering, `--from-lir`)
        # Stage 2, the backend written in Sisu (compiler/stage2), built here
        # with `sisu build --native`, lowers each case's SIR to LIR, the
        # backend-neutral low IR; the LIR is built with `sisu build --native
        # --from-lir`, run, and its executable compared byte for byte with
        # the one the SIR gives, in both profiles (decision 284).
        run: ./target/debug/sisu-conformance --sisu target/debug/sisu --native-from-lir conformance/native.list
      - name: Native conformance with Cranelift, the oracle (`--backend=cranelift`)
        # Cranelift, the oracle of the backend written in Sisu (decision
        # 331), compiles stage 2's LIR of each case to an object linked with
        # the same runtime; the runs are compared with the interpreter's
        # expectations, as the Sisu backend's are above.
        run: ./target/debug/sisu-conformance --sisu target/debug/sisu --native-cranelift conformance/native.list
      - name: Stage 1 compiled natively (informational, never fails)
        # The bootstrap path: stage 1 built by the backend with stage 1 as
        # its front end, its token stream and tree of the prelude against
        # the Rust front end's (`--front-end=rust`, the oracle).
        continue-on-error: true
        working-directory: compiler/stage1
        run: |
          ../target/debug/sisu build --native --output "$RUNNER_TEMP/stage1"
          "$RUNNER_TEMP/stage1" tokens --trivia ../std/prelude.sisu > "$RUNNER_TEMP/tokens.native"
          ../target/debug/sisu --front-end=rust tokens --trivia ../std/prelude.sisu > "$RUNNER_TEMP/tokens.stage0"
          cmp "$RUNNER_TEMP/tokens.native" "$RUNNER_TEMP/tokens.stage0"
          "$RUNNER_TEMP/stage1" parse --tree ../std/prelude.sisu > "$RUNNER_TEMP/tree.native"
          ../target/debug/sisu --front-end=rust parse --tree ../std/prelude.sisu > "$RUNNER_TEMP/tree.stage0"
          cmp "$RUNNER_TEMP/tree.native" "$RUNNER_TEMP/tree.stage0"

  bootstrap:
    # The Sisu backend's fixed point (D-087, step 2; decision 330): stage 2
    # built through the Cranelift path compiles stage 2 and stage 1 with
    # the backend written in Sisu; those executables compile both again;
    # the two builds must be byte for byte the same. On pushes only, like
    # the rest of CI, never on a schedule.
    name: stage-2 Sisu backend's fixed point
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup override set 1.97.0
          rustc --version
          cc --version
      - name: Cache the cargo registry and the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler/target
          key: native-${{ runner.os }}-rust-1.97.0-${{ hashFiles('compiler/Cargo.lock') }}
          restore-keys: |
            native-${{ runner.os }}-rust-1.97.0-
      - name: Build the compiler and the runtime
        run: cargo build
      - name: The fixed point (stage2/bootstrap.sh)
        # Prints each executable's and each SIR's size and SHA-256, and
        # fails when an executable built by stage 2 compiled by itself
        # differs from the one stage 2 compiled by Cranelift built; the
        # files are kept for the upload below when it fails.
        run: ./stage2/bootstrap.sh --sisu target/debug/sisu --keep "$RUNNER_TEMP/fixed-point"
      - name: The executables and the SIR of a failed fixed point
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-point-${{ github.sha }}
          path: ${{ runner.temp }}/fixed-point/
          if-no-files-found: ignore
