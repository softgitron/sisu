# Stage 1 of the bootstrap (compiler/stage1, the front end written in Sisu)
# checked byte for byte against the Rust front end over the whole corpus,
# and over its own package (D-078's first half of the fixed point). On
# pushes only, like the rest of CI, never on a schedule.
name: stage1

on:
  push:

jobs:
  stage1:
    name: stage-1 front end in Sisu against stage 0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup override set 1.97.0
          rustc --version
          cc --version
      - name: Cache the cargo registry and the release build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler/target/release
          key: stage1-${{ runner.os }}-rust-1.97.0-${{ hashFiles('compiler/Cargo.lock') }}-${{ hashFiles('compiler/crates/**') }}
          restore-keys: |
            stage1-${{ runner.os }}-rust-1.97.0-${{ hashFiles('compiler/Cargo.lock') }}-
            stage1-${{ runner.os }}-rust-1.97.0-
      - name: Build stage 0 (release)
        run: cargo build --release
      - name: Stage 1's own tests (on the interpreter)
        working-directory: compiler/stage1
        run: ../target/release/sisu test
      - name: Stage 1 formatted canonically
        working-directory: compiler/stage1
        run: ../target/release/sisu fmt --check src
      - name: Stage 1 against stage 0 (tokens, trees, AST, names, types, SIR, ownership, self)
        # Stage 1 is built natively by the stage-2 backend and run over the
        # corpus and its own package; every difference must be listed in
        # compiler/stage1/DISCREPANCIES.md (none are).
        working-directory: compiler/stage1
        run: ./check.sh --native --names --types --sir
